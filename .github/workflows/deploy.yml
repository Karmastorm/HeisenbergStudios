name: Deploy to Bluehost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          local_path: './*'
          remote_path: '/public_html/heisenbergstudios/'
          # Never deploy server-state, setup helpers, secrets, or repo meta.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/setup/**
            **/.env
            **/.env.*
            **/node_modules/**
            **/.ftp-deploy-sync-state.json
            **/.ftpquota
            **/error_log
            **/*.phpupgrader.*
            **/_index.html
