name: Deploy to Bluehost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          local_path: './*'
          remote_path: '/public_html/heisenbergstudios/'
          sftpArgs: '-o ConnectTimeout=15'
          # Exclude repo meta, setup helpers, secrets, and server-state.
          rsyncArgs: '--exclude=.git --exclude=.github --exclude=setup --exclude=.env --exclude=node_modules --exclude=README.md'